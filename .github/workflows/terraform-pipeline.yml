name: Terraform Workflow

on:
  push:
    branches:
      - create-ec2   # Trigger workflow on push to the dev branch
  pull_request:
    branches:
      - dev   # Trigger workflow on pull requests targeting the dev branch

permissions: read-all
jobs:
  terraform:
    runs-on: ubuntu-latest
    
    env:
      terraform_version: 1.11.2 # Specify the Terraform version you need
      plan_file: tfplan

    steps:
      # Step 1: Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v2
        id: checkout

      # Step 2a: Cache Checkov dependencies
      - name: Cache Checkov dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip  # Path to cache pip dependencies
          key: ${{ runner.os }}-checkov-${{ hashFiles('**/requirements.txt') }}  # Cache key based on the files that might change
          restore-keys: |
            ${{ runner.os }}-checkov-
    
      # Step 2b: Run Checkov to scan terraform files for security issues
      - name: Checkov Scan
        run: |
          python -m pip install --upgrade pip
          pip install checkov
          checkov -d .
        id: checkov
      #  continue-on-error: true

      # Step 3: Set up AWS credentials
      - name: Set up AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}  # Change to your AWS region

      # Step 4: Set up Terraform
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v1
        with:
          terraform_version: ${{env.terraform_version}}  # You can specify the version you need

      # Step 5: Cache Terraform plugins
      - name: Cache Terraform plugins
        uses: actions/cache@v4
        with:
          path: ~/.terraform.d/plugin-cache
          key: ${{ runner.os }}-terraform-${{ hashFiles('**/*.tf') }}
          restore-keys: |
            ${{ runner.os }}-terraform-
        continue-on-error: true

      # Step 6: Initialize Terraform with S3 backend
      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.TF_STATE_KEY }}" \
            -backend-config="region=${{ secrets.AWS_REGION }}"  # Replace with your region

      # Step 7: Validate Terraform configuration
      - name: Terraform Validate
        run: |
          terraform fmt
          terraform validate

      # Step 8: Backup current Terraform state
      - name: Backup Terraform State
        run: |
          aws s3 cp s3://${{ secrets.TF_STATE_BUCKET }}/${{ secrets.TF_STATE_KEY }} terraform.tfstate.backup  

      # Step 9: Run Terraform Plan
      - name: Terraform Plan
        run: terraform plan -out=${{ env.plan_file }}

      # Step 10: Run Terraform Apply
      - name: Terraform Apply
        run: terraform apply -auto-approve ${{ env.plan_file}} || (echo "Apply failed, attempting rollback..." && exit 1)
        id: apply
        # env:
        #   TF_VAR_some_variable: ${{ secrets.TF_VAR_some_variable }}  # If you use any sensitive variables
      
      # Step 11: Notify Success
      - name: Notify Success
        if: steps.apply.outcome == 'success'
        run: echo "Terraform apply completed successfully."
          # # Optional: Clean up state file (if needed)
          # - name: Clean up state
          #   run: terraform state rm aws_instance.prod_instance  # Example of removing resources, adjust as needed

      # Step 10-F1: (Optional) Upload Terraform Backup state as artifact
      - name: (Optional) Upload Terraform State
        if: steps.apply.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-state-before-workflow-backup
          path: terraform.tfstate.backup
        id: upload-backup-artifact
        continue-on-error: true

      # Step 10-F2: (Optional) Rollback on Failure\
      - name: (Optional) RollBack on Failure
        if: steps.apply.outcome == 'failure'
        run: |
          echo "Rolling back changes..."
              # Restore the previous state
          aws s3 cp terraform.tfstate.backup s3://${{ secrets.TF_STATE_BUCKET }}/${{ secrets.TF_STATE_KEY }}
              # Destroy any partially created resources
          terraform init
          terraform destroy -auto-approve ${{ env.plan_file }}
        id: rollback

      # Step 10-F2-F: Notify Failure
      - name: (Optional) Notify Failure
        if: steps.rollback.conclusion == 'failure'
        run: |
          echo "Rollback failed. Manual intervention required."
          exit 1


